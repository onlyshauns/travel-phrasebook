<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Phrasebook</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --dark: #1a1612;
    --rouge: #c0392b;
    --gold: #c9a84c;
    --muted: #8a7f72;
    --card: #fff;
    --border: #e0d8cc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--dark);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 60px;
  }

  .container { max-width: 620px; margin: 0 auto; }

  /* ── HOME ── */
  .home-header { text-align: center; margin-bottom: 44px; }
  .home-header .globe { font-size: 2.4rem; display: block; margin-bottom: 12px; }
  .home-header h1 { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; }
  .home-header h1 em { font-style: italic; color: var(--rouge); }
  .home-header p { color: var(--muted); font-size: 0.9rem; margin-top: 10px; font-weight: 300; letter-spacing: 0.05em; text-transform: uppercase; }
  .divider { width: 40px; height: 2px; background: var(--gold); margin: 14px auto 0; }

  .country-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  @media (min-width: 460px) { .country-grid { grid-template-columns: repeat(3, 1fr); } }

  .country-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 12px 20px;
    text-align: center;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
  }
  .country-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.09); transform: translateY(-2px); border-color: var(--gold); }
  .country-card .flag { font-size: 2.6rem; display: block; margin-bottom: 10px; }
  .country-card .cname { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; display: block; margin-bottom: 4px; }
  .country-card .clang { font-size: 0.75rem; color: var(--muted); font-style: italic; }

  /* ── PHRASEBOOK ── */
  #phrasebook { display: none; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 100px;
    padding: 7px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: 32px;
    transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--dark); color: var(--dark); }

  .pb-header { text-align: center; margin-bottom: 28px; }
  .pb-header .flag-lg { font-size: 2.6rem; display: block; margin-bottom: 10px; }
  .pb-header h2 { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
  .pb-header h2 em { font-style: italic; color: var(--rouge); }
  .pb-header p { color: var(--muted); font-size: 0.85rem; margin-top: 8px; font-weight: 300; letter-spacing: 0.05em; text-transform: uppercase; }

  /* ── MODE TOGGLE ── */
  .mode-toggle {
    display: flex;
    background: #ede8df;
    border-radius: 100px;
    padding: 4px;
    margin-bottom: 24px;
    gap: 4px;
  }
  .mode-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all 0.18s;
  }
  .mode-btn.active { background: #fff; color: var(--dark); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  /* ── PHRASE TABS ── */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
  }
  .tab {
    padding: 8px 18px;
    border: 1.5px solid var(--border);
    background: transparent;
    border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s;
  }
  .tab:hover { border-color: var(--rouge); color: var(--rouge); }
  .tab.active { background: var(--rouge); border-color: var(--rouge); color: #fff; }

  .section { display: none; }
  .section.active { display: block; }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 400;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* ── PHRASE CARDS ── */
  .phrases { display: grid; gap: 12px; }
  .phrase-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .phrase-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.07); transform: translateY(-1px); }

  .play-btn {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--rouge);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
  }
  .play-btn:hover { background: #a93226; }
  .play-btn:active { transform: scale(0.94); }
  .play-btn.speaking { background: var(--gold); animation: pulse 0.8s ease-in-out infinite alternate; }
  @keyframes pulse {
    from { box-shadow: 0 0 0 0 rgba(201,168,76,0.4); }
    to   { box-shadow: 0 0 0 8px rgba(201,168,76,0); }
  }
  .play-icon { width: 14px; height: 14px; }

  .phrase-text { flex: 1; min-width: 0; }
  .native { font-size: 1.1rem; font-weight: 700; color: var(--dark); margin-bottom: 3px; line-height: 1.3; }
  #phrasebook.latin .native { font-family: 'Playfair Display', serif; }
  .pronunciation { font-size: 0.78rem; color: var(--rouge); font-style: italic; margin-bottom: 4px; }
  .english { font-size: 0.82rem; color: var(--muted); }

  .tip-box {
    background: #fff8ee;
    border: 1px solid #f0dfa0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: #7a6830;
    margin-top: 20px;
    line-height: 1.5;
  }
  .tip-box strong { font-weight: 600; }

  .no-speech {
    display: none;
    background: #fff3f3;
    border: 1px solid #f5c6c6;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: var(--rouge);
    margin-bottom: 20px;
    text-align: center;
  }

  /* ── TRAVEL INFO ── */
  #travelInfo { display: none; }

  .info-section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    font-weight: 400;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  /* Culture — gold rule list */
  .culture-list { margin-bottom: 36px; }
  .culture-item {
    padding: 14px 0 14px 18px;
    border-left: 3px solid var(--gold);
    margin-left: 2px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .culture-item:last-child { border-bottom: none; }
  .culture-item .ci-emoji { font-size: 1.15rem; flex-shrink: 0; margin-top: 1px; }
  .culture-item .ci-rule { font-weight: 600; font-size: 0.88rem; margin-bottom: 3px; line-height: 1.3; }
  .culture-item .ci-note { font-size: 0.79rem; color: var(--muted); line-height: 1.5; }

  /* Apps — 2-column grid */
  .apps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .app-tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .app-tile-top { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .app-tile-icon {
    width: 36px; height: 36px;
    border-radius: 9px;
    background: var(--cream);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; flex-shrink: 0;
  }
  .app-tile-cat { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--rouge); margin-bottom: 1px; }
  .app-tile-name { font-weight: 600; font-size: 0.85rem; line-height: 1.2; }
  .app-tile-desc { font-size: 0.75rem; color: var(--muted); line-height: 1.45; flex: 1; margin-bottom: 10px; }

  .store-links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .store-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.65rem;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
    background: var(--cream);
    transition: all 0.15s;
    white-space: nowrap;
  }
  .store-link:hover { border-color: var(--dark); color: var(--dark); background: #fff; }
</style>
</head>
<body>
<div class="container">

  <!-- HOME -->
  <div id="home">
    <div class="home-header">
      <span class="globe">🌏</span>
      <h1>Travel <em>Phrasebook</em></h1>
      <p>Pick a country to get started</p>
      <div class="divider"></div>
    </div>
    <div class="country-grid" id="countryGrid"></div>
  </div>

  <!-- PHRASEBOOK -->
  <div id="phrasebook">
    <button class="back-btn" onclick="goHome()">← All Countries</button>

    <div class="pb-header">
      <span class="flag-lg" id="pbFlag"></span>
      <h2 id="pbTitle"></h2>
      <p id="pbSubtitle"></p>
      <div class="divider"></div>
    </div>

    <!-- MODE TOGGLE -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="modePhrasesBtn" onclick="setMode('phrases')">🗣️ Phrases</button>
      <button class="mode-btn" id="modeInfoBtn" onclick="setMode('info')">✈️ Travel Info</button>
    </div>

    <!-- PHRASES PANEL -->
    <div id="phrasesPanel">
      <div class="no-speech" id="noSpeech">⚠️ Your browser doesn't support text-to-speech. Try Chrome or Safari.</div>
      <div class="tabs">
        <button class="tab active" onclick="showSection('greetings', event)">👋 Greetings</button>
        <button class="tab" onclick="showSection('food', event)">🍽️ Food & Dining</button>
        <button class="tab" onclick="showSection('directions', event)">🗺️ Directions</button>
        <button class="tab" onclick="showSection('shopping', event)">🛍️ Shopping</button>
        <button class="tab" onclick="showSection('numbers', event)">🔢 Numbers</button>
        <button class="tab" onclick="showSection('emergency', event)">🆘 Emergency</button>
      </div>
      <div class="section active" id="greetings">
        <div class="section-title">Greetings & Pleasantries</div>
        <div class="phrases" id="phrases-greetings"></div>
        <div class="tip-box" id="tip-greetings"></div>
      </div>
      <div class="section" id="food">
        <div class="section-title">Food & Dining</div>
        <div class="phrases" id="phrases-food"></div>
        <div class="tip-box" id="tip-food"></div>
      </div>
      <div class="section" id="directions">
        <div class="section-title">Getting Around</div>
        <div class="phrases" id="phrases-directions"></div>
        <div class="tip-box" id="tip-directions"></div>
      </div>
      <div class="section" id="shopping">
        <div class="section-title">Shopping</div>
        <div class="phrases" id="phrases-shopping"></div>
        <div class="tip-box" id="tip-shopping"></div>
      </div>
      <div class="section" id="numbers">
        <div class="section-title">Numbers & Counting</div>
        <div class="phrases" id="phrases-numbers"></div>
        <div class="tip-box" id="tip-numbers"></div>
      </div>
      <div class="section" id="emergency">
        <div class="section-title">Emergency & Help</div>
        <div class="phrases" id="phrases-emergency"></div>
        <div class="tip-box" id="tip-emergency"></div>
      </div>
    </div>

    <!-- TRAVEL INFO PANEL -->
    <div id="travelInfo">
      <div class="info-section-title">Culture & Etiquette</div>
      <div class="culture-list" id="cultureList"></div>
      <div class="info-section-title">Useful Apps</div>
      <div class="apps-grid" id="appsGrid"></div>
    </div>

  </div>

</div>

// ─── STATE ───────────────────────────────────────────────────────────────────

let currentLangCode = 'en';
const SECTIONS = ['greetings','food','directions','shopping','numbers','emergency'];

// ─── HOME ────────────────────────────────────────────────────────────────────

function buildHome() {
  const grid = document.getElementById('countryGrid');
  for (const [id, c] of Object.entries(countries)) {
    const card = document.createElement('div');
    card.className = 'country-card';
    card.onclick = () => selectCountry(id);
    card.innerHTML = `<span class="flag">${c.flag}</span><span class="cname">${c.name}</span><span class="clang">${c.lang}</span>`;
    grid.appendChild(card);
  }
}

// ─── COUNTRY ─────────────────────────────────────────────────────────────────

function selectCountry(id) {
  const c = countries[id];
  currentLangCode = c.langCode;

  document.getElementById('pbFlag').textContent = c.flag;
  document.getElementById('pbTitle').innerHTML = `${c.name} <em>Phrasebook</em>`;
  document.getElementById('pbSubtitle').textContent = `${c.lang} · tap any phrase to hear it`;

  const pb = document.getElementById('phrasebook');
  pb.classList.toggle('latin', c.latinScript);

  SECTIONS.forEach(s => {
    document.getElementById(`phrases-${s}`).innerHTML = '';
    const tip = document.getElementById(`tip-${s}`);
    if (c.tips[s]) { tip.innerHTML = c.tips[s]; tip.style.display = ''; }
    else tip.style.display = 'none';
  });

  buildPhrases(c);
  buildTravelInfo(c);
  showSectionById('greetings');
  setMode('phrases');

  document.getElementById('home').style.display = 'none';
  pb.style.display = 'block';
  window.scrollTo(0, 0);
}

function goHome() {
  window.speechSynthesis.cancel();
  document.getElementById('phrasebook').style.display = 'none';
  document.getElementById('home').style.display = 'block';
  window.scrollTo(0, 0);
}

// ─── PHRASES ─────────────────────────────────────────────────────────────────

function buildPhrases(country) {
  for (const [section, phrases] of Object.entries(country.data)) {
    const container = document.getElementById(`phrases-${section}`);
    phrases.forEach(p => {
      const card = document.createElement('div');
      card.className = 'phrase-card';
      card.innerHTML = `
        <button class="play-btn" onclick="speak(this, ${JSON.stringify(p.native)})">
          <svg class="play-icon" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="phrase-text">
          <div class="native">${p.native}</div>
          <div class="pronunciation">${p.pron}</div>
          <div class="english">${p.en}</div>
        </div>`;
      container.appendChild(card);
    });
  }
}

// ─── TRAVEL INFO ─────────────────────────────────────────────────────────────

function buildTravelInfo(country) {
  const cultureEl = document.getElementById('cultureList');
  cultureEl.innerHTML = '';
  country.culture.forEach(item => {
    const el = document.createElement('div');
    el.className = 'culture-item';
    el.innerHTML = `
      <span class="ci-emoji">${item.e}</span>
      <div><div class="ci-rule">${item.rule}</div><div class="ci-note">${item.note}</div></div>`;
    cultureEl.appendChild(el);
  });

  const appsEl = document.getElementById('appsGrid');
  appsEl.innerHTML = '';
  country.apps.forEach(app => {
    const el = document.createElement('div');
    el.className = 'app-tile';
    el.innerHTML = `
      <div class="app-tile-top">
        <div class="app-tile-icon">${app.e}</div>
        <div><div class="app-tile-cat">${app.cat}</div><div class="app-tile-name">${app.name}</div></div>
      </div>
      <div class="app-tile-desc">${app.desc}</div>
      <div class="store-links">
        <a class="store-link" href="${app.ios}" target="_blank" rel="noopener">🍎 App Store</a>
        <a class="store-link" href="${app.android}" target="_blank" rel="noopener">▶ Google Play</a>
      </div>`;
    appsEl.appendChild(el);
  });
}

// ─── MODE TOGGLE ─────────────────────────────────────────────────────────────

function setMode(mode) {
  const isPhrase = mode === 'phrases';
  document.getElementById('phrasesPanel').style.display = isPhrase ? 'block' : 'none';
  document.getElementById('travelInfo').style.display  = isPhrase ? 'none' : 'block';
  document.getElementById('modePhrasesBtn').classList.toggle('active', isPhrase);
  document.getElementById('modeInfoBtn').classList.toggle('active', !isPhrase);
  if (isPhrase) window.speechSynthesis.cancel();
}

// ─── TABS ────────────────────────────────────────────────────────────────────

function showSection(id, e) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
}

function showSectionById(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', SECTIONS[i] === id));
}

// ─── SPEECH ──────────────────────────────────────────────────────────────────

function speak(btn, text) {
  if (!('speechSynthesis' in window)) { document.getElementById('noSpeech').style.display = 'block'; return; }
  window.speechSynthesis.cancel();
  document.querySelectorAll('.play-btn').forEach(b => b.classList.remove('speaking'));
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = currentLangCode;
  utter.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang.startsWith(currentLangCode.split('-')[0]));
  if (voice) utter.voice = voice;
  btn.classList.add('speaking');
  utter.onend  = () => btn.classList.remove('speaking');
  utter.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(utter);
}

window.speechSynthesis.onvoiceschanged = () => {};
buildHome();
</script>
